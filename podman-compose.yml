name: team09
networks:
  core-network:
    external: true
services:
  frontend:
    image: localhost:5000/team09/frontend:dev
    networks: [core-network]
    ports: ["8080:80"]
  api:
    image: localhost:5000/team09/api:dev
    networks: [core-network]
    ports: ["8081:8081"]
    environment:
      LLM_BASE_URL: http://llm.internal:9080/v1
      LLM_API_KEY: ${LLM_API_KEY}
